<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin:0;padding:0;background-color:#0A0F1E;font-family:'Segoe UI',Roboto,Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0A0F1E;padding:40px 20px;">
        <tr>
            <td align="center">
                <table width="100%" cellpadding="0" cellspacing="0"
                    style="max-width:520px;background-color:#111827;border-radius:16px;border:1px solid #1F2937;overflow:hidden;">

                    <tr>
                        <td style="background:linear-gradient(135deg,#0A6847,#065535);padding:32px;text-align:center;">
                            <div
                                style="width:56px;height:56px;border-radius:50%;background-color:rgba(255,255,255,0.15);margin:0 auto 16px;line-height:56px;font-size:24px;font-weight:bold;color:#fff;">
                                P</div>
                            <h1 style="margin:0;color:#fff;font-size:22px;font-weight:700;">Sign-In Link</h1>
                            <p style="margin:8px 0 0;color:rgba(255,255,255,0.8);font-size:14px;">Premcare Physiotherapy
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:32px;">
                            <p style="color:#E5E7EB;font-size:16px;line-height:1.6;margin:0 0 24px;">
                                Click the button below to sign in to your Premcare account. No password needed!
                            </p>

                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center">
                                        <a href="{{ .ConfirmationURL }}"
                                            style="display:inline-block;background-color:#0A6847;color:#fff;text-decoration:none;padding:14px 32px;border-radius:12px;font-size:16px;font-weight:600;">
                                            Sign In to Premcare
                                        </a>
                                    </td>
                                </tr>
                            </table>

                            <p style="color:#9CA3AF;font-size:13px;margin:24px 0 0;text-align:center;">
                                This link expires in 1 hour and can only be used once.
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:24px 32px;border-top:1px solid #1F2937;text-align:center;">
                            <p style="color:#6B7280;font-size:12px;margin:0 0 4px;">Premcare Physiotherapy Clinic</p>
                            <p style="color:#6B7280;font-size:12px;margin:0;">Expert care, wherever you are 🇳🇬</p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
